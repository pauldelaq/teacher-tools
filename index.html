<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="apple-mobile-web-app-title" content="My Worksheets">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="theme-color" content="white">
        <link rel="apple-touch-icon" href="./icons/icon-192x192.png">  
        <title>My Worksheets</title>
        <link rel="stylesheet" href="./css/styles.css">
        <link rel="stylesheet" href="./css/print.css" media="print">
        <link rel="manifest" href="./manifest.json">
    </head>
    <body>
        <header>
            <h1>MW</h1>
                <button id="hamburger-menu-button" class="top-menu-button hamburger-menu-button"><img src="./assets/menu.svg"></button>
            <div class="header-tools">
                <button id="print-button" class="top-menu-button printer-icon"><img src="./assets/printer.svg"></button>
                <button id="copy-button" class="top-menu-button"><img src="./assets/clipboard.svg"></button>
                <button id="mode-button" class="top-menu-button"><img src="./assets/student.svg"></button>
                <button id="add-button" class="top-menu-button">+</button>
                <button id="close-exercise-menu" class="top-menu-button hidden">X</button>
            </div>
        </header>
        <div class="stuff-under-header">
            <div id="create-exercise-menu" class="menu-overlay hidden">
                <h1 class="left-space">What kind of content do you want to create?</h1>
                <div id="exercise-list-display" class="exercise-list"></div>
            </div>
            <div id="editing-interface" class="menu-overlay hidden">
                <h1 id="exercise-type" class="exercise-type">Type of exercise goes here</h1>
                <div id="heading-container"></div>
                <h2 id="exercise-description" class="exercise-description"></h2>
                <div id="editor-body" class="editor-body"></div>
                <button id="save-edit" class="menu-buttons">Save</button>
                <button id="close-editing-interface" class="menu-buttons">Close</button>
                <div id="editing-tools-display" class="editing-tools-display"></div>
            </div>
            <div id="worksheet-page" class="worksheet-page">
                <main>
                    <h1 id="add-first-exercise-text" class="hidden">Please press the "+" button to add a title or exercise.</h1>
                    <div id="worksheet"></div>
                </main>
            </div>
            <div id="hamburger-menu" class="hamburger-menu menu-overlay hidden">
                <button id="new-worksheet-button">Create New Worksheet</button>
                <button id="load-template-worksheet-button">Load Template Worksheet</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
